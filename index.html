<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chore Champions</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap');

:root{
  --bg:#FFF8ED;
  --bg-deep:#FFEAD1;
  --card:#FFFFFF;
  --card-line:#FFE1EC;
  --card-shadow:#E9C9D6;
  --ink:#3A2E35;
  --ink-soft:#8A7A85;
  --pink:#FF6FA5;
  --pink-deep:#C94A80;
  --gold:#FFCB3D;
  --gold-deep:#D99A00;
  --coral:#FF8A65;
  --coral-deep:#D65A3A;
  --green:#6BCB4F;
  --green-deep:#3F9E2C;
  --red:#FF5A5A;
  --red-deep:#C23A3A;
  --blue:#3DC6F0;
  --blue-deep:#1B8FB0;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:'Nunito',sans-serif;
  background:
    radial-gradient(circle at 15% 10%, rgba(255,111,165,0.07) 0, transparent 40%),
    radial-gradient(circle at 90% 85%, rgba(61,198,240,0.08) 0, transparent 40%),
    var(--bg);
  color:var(--ink);
  min-height:100vh;
}

#app{max-width:900px;margin:0 auto;padding:20px 18px 60px;}

.title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{width:46px;height:46px;border-radius:50%;background:var(--gold);border:2.5px dashed #fff;box-shadow:0 3px 0 rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.brand h1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:26px;color:var(--pink-deep);margin:0;letter-spacing:.3px;}
.brand p{margin:0;font-size:12px;color:var(--ink-soft);letter-spacing:.6px;text-transform:uppercase;font-weight:700;}

.pill-btn{
  font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;
  background:var(--card);color:var(--ink-soft);border:2px solid var(--card-line);
  border-radius:999px;padding:9px 16px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  transition:transform .12s ease, background .12s ease;
}
.pill-btn:hover{background:#FFF0F5;transform:translateY(-1px);}
.pill-btn:active{transform:translateY(0);}
.pill-btn.solid{background:var(--gold);color:#4A3300;border-color:var(--gold);}
.pill-btn.solid:hover{background:#FFD666;}

.card{
  background:var(--card);
  border:1px solid var(--card-line);
  border-radius:16px;
  box-shadow:0 5px 0 rgba(0,0,0,.14);
  padding:18px;
}

.section-label{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-soft);margin:26px 0 12px;}

.kid-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;}
.kid-tile{
  background:var(--card);border:1px solid var(--card-line);border-radius:18px;
  padding:18px 12px;text-align:center;cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,.14);
  transition:transform .12s ease;
}
.kid-tile:hover{transform:translateY(-3px);}
.kid-tile:active{transform:translateY(0);}

.badge{width:78px;height:78px;border-radius:50%;margin:0 auto 10px;position:relative;display:flex;align-items:center;justify-content:center;}
.badge .ring{position:absolute;inset:0;border-radius:50%;border:5px solid var(--kc,var(--gold));}
.badge .face{position:absolute;inset:8px;border-radius:50%;background:#fff;border:2px dashed var(--kc,var(--gold));display:flex;align-items:center;justify-content:center;font-size:32px;}

.kid-name{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:17px;color:var(--ink);margin:0 0 4px;}
.kid-points{font-family:'Space Mono',monospace;font-weight:700;font-size:13px;color:var(--ink-soft);}

.dash-header{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
.dash-header .badge{width:58px;height:58px;margin:0;}
.dash-header .badge .face{font-size:24px;}
.dash-header h2{font-family:'Baloo 2',sans-serif;font-size:22px;color:var(--pink-deep);margin:0;}
.point-total{font-family:'Space Mono',monospace;color:var(--ink-soft);font-size:13px;font-weight:700;}
.point-total b{color:var(--gold-deep);font-size:16px;}

.tabs{display:flex;gap:8px;margin:18px 0 16px;flex-wrap:wrap;}
.tab{
  font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;
  background:var(--card);border:2px solid var(--card-line);color:var(--ink-soft);
  border-radius:12px;padding:8px 14px;cursor:pointer;
}
.tab.active{background:var(--gold);border-color:var(--gold);color:#4A3300;}

.item-list{display:flex;flex-direction:column;gap:10px;}
.item-card{
  background:var(--card);border:1px solid var(--card-line);border-radius:14px;
  padding:12px 14px;display:flex;align-items:center;gap:12px;
  box-shadow:0 3px 0 rgba(0,0,0,.1);
}
.item-emoji{font-size:26px;width:40px;text-align:center;flex-shrink:0;}
.item-body{flex:1;min-width:0;}
.item-name{font-weight:800;font-size:15px;color:var(--ink);}
.item-sub{font-family:'Space Mono',monospace;font-size:12px;color:var(--ink-soft);margin-top:2px;}
.item-action{flex-shrink:0;}

.btn{
  font-family:'Baloo 2',sans-serif;font-weight:700;font-size:13.5px;
  border:none;border-radius:10px;padding:9px 14px;cursor:pointer;
  color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18);
}
.btn:active{transform:translateY(2px);box-shadow:none;}
.btn.go{background:var(--green);}
.btn.go:disabled{background:#B9C4BD;cursor:not-allowed;box-shadow:none;}
.btn.warn{background:var(--coral);}
.btn.bad{background:var(--red);}
.btn.ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--card-line);box-shadow:none;}

.status-chip{
  font-family:'Space Mono',monospace;font-size:11px;font-weight:700;
  padding:4px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.4px;flex-shrink:0;
}
.status-chip.pending{background:#FCEBC8;color:#8A5A00;}
.status-chip.approved{background:#DBF0E1;color:var(--green-deep);}
.status-chip.rejected{background:#F7DAD5;color:var(--red-deep);}
.status-chip.fulfilled{background:#DBEFF0;color:#1F6E73;}
.status-chip.cancelled{background:#EFEAE0;color:var(--ink-soft);}

.empty{
  text-align:center;padding:34px 16px;color:var(--ink-soft);font-weight:700;
  font-family:'Baloo 2',sans-serif;font-size:15px;
}

.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(0);
  background:var(--gold);color:#3B2900;font-family:'Baloo 2',sans-serif;font-weight:700;
  padding:12px 20px;border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.35);
  z-index:999;font-size:14px;opacity:0;transition:opacity .25s ease, transform .25s ease;
  pointer-events:none;max-width:90%;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

.pin-wrap{max-width:280px;margin:40px auto;text-align:center;}
.pin-dots{display:flex;justify-content:center;gap:12px;margin:20px 0;}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--gold);}
.pin-dot.filled{background:var(--gold);}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.pin-key{
  font-family:'Space Mono',monospace;font-weight:700;font-size:20px;
  background:var(--card);color:var(--ink);border:2px solid var(--card-line);border-radius:12px;
  padding:16px 0;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.1);
}
.pin-key:active{background:var(--pink);color:#fff;box-shadow:none;transform:translateY(3px);}
.pin-key.clear{font-size:13px;font-family:'Baloo 2',sans-serif;}

.form-box{background:#FFF3F8;border:1px dashed var(--card-line);border-radius:14px;padding:14px;margin-top:12px;}
.form-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.form-row input, .form-row select{
  font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;
  padding:9px 11px;border-radius:9px;border:1.5px solid var(--card-line);
  background:#fff;color:var(--ink);flex:1;min-width:90px;
}
.emoji-choices{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.emoji-choices button{
  font-size:18px;background:#fff;border:1.5px solid var(--card-line);border-radius:9px;
  padding:6px 9px;cursor:pointer;
}
.emoji-choices button.sel{border-color:var(--gold);background:#FFF3D8;}

.manage-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--card-line);border-radius:12px;padding:10px 12px;}
.manage-row input[type=text], .manage-row input[type=number]{
  font-family:'Nunito',sans-serif;font-weight:700;padding:7px 9px;border-radius:8px;
  border:1.5px solid var(--card-line);width:70px;
}
.manage-row input.name-field{flex:1;width:auto;}

.back-link{background:none;border:none;color:var(--pink-deep);font-family:'Baloo 2',sans-serif;font-weight:700;
  cursor:pointer;font-size:14px;padding:0;margin-bottom:14px;display:inline-flex;align-items:center;gap:5px;}
.back-link:hover{color:var(--pink);}

.hint{font-size:12px;color:var(--ink-soft);margin:6px 0 0;}

.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px;}
.week-day{background:var(--card);border:1px solid var(--card-line);border-radius:10px;padding:8px 2px;text-align:center;}
.week-day.today{border-color:var(--gold);border-width:2px;}
.week-day.full{background:#DBF0E1;}
.week-day.partial{background:#FCEBC8;}
.week-day.empty{background:#F7DAD5;}
.week-day.future{opacity:.45;}
.week-day-label{font-family:'Space Mono',monospace;font-size:10px;color:var(--ink-soft);text-transform:uppercase;}
.week-day-num{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px;color:var(--ink);margin:2px 0;}
.week-day-icon{font-size:14px;}

.flip-card{perspective:1200px;margin-bottom:12px;}
.flip-card-inner{position:relative;width:100%;min-height:220px;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.flip-card.flipped .flip-card-inner{transform:rotateY(180deg);min-height:600px;}
.flip-card-front,.flip-card-back{position:absolute;inset:0;width:100%;backface-visibility:hidden;border-radius:16px;}
.flip-card-back{transform:rotateY(180deg);overflow-y:auto;}
.flip-card:not(.flipped) .flip-card-back{visibility:hidden;}
.flip-card.flipped .flip-card-front{visibility:hidden;}

.poke-front{
  background:linear-gradient(160deg,#FFFFFF,#FFE9F2);
  border:3px solid var(--gold);border-radius:16px;padding:16px;cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,.14);
}
.poke-type-badge{
  display:inline-block;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:11px;
  color:#fff;border-radius:999px;padding:3px 10px;letter-spacing:.3px;
}
.poke-front-emoji{font-size:44px;text-align:center;margin:6px 0;}
.poke-front-name{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:17px;text-align:center;color:var(--ink);}
.poke-front-price{font-family:'Space Mono',monospace;font-weight:700;text-align:center;font-size:14px;color:var(--ink-soft);margin-top:2px;}
.poke-tap-hint{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:8px;font-weight:700;}

.poke-back{
  background:linear-gradient(160deg,#FFFFFF,#E8F7FC);
  border:3px solid var(--gold);border-radius:16px;padding:14px;cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,.14);height:100%;box-sizing:border-box;
}
.poke-back-header{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.poke-back-header .emoji{font-size:26px;}
.poke-back-header .name{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;color:var(--ink);flex:1;}
.stat-row{margin-bottom:8px;}
.stat-row-label{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px;}
.stat-bar-track{background:#E5D9B8;border-radius:999px;height:9px;overflow:hidden;}
.stat-bar-fill{height:100%;border-radius:999px;}
.origin-story{background:#fff;border:1px dashed var(--card-line);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--ink);font-style:italic;margin:8px 0;}
.money-report{background:#fff;border-radius:10px;padding:10px;margin-top:8px;}
.money-row{margin-bottom:7px;}
.money-row-label{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--ink);margin-bottom:2px;}
.money-row-track{background:#EFE7CF;border-radius:6px;height:14px;overflow:hidden;}
.money-row-fill{height:100%;border-radius:6px;}
.poke-close{text-align:center;font-size:11px;color:var(--ink-soft);font-weight:800;margin-top:10px;}

input[type=range]{-webkit-appearance:none;appearance:none;height:8px;border-radius:999px;background:#E5D9B8;outline:none;margin:4px 0 2px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--gold);border:3px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.25);cursor:pointer;}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--gold);border:3px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.25);cursor:pointer;}

@media (max-width:520px){
  .brand h1{font-size:21px;}
  .kid-grid{grid-template-columns:repeat(auto-fit,minmax(110px,1fr));}
}
</style>

<script>
/* ===== CLOUD SYNC SETUP =====
   To sync across your iPad and phone, create a free Firebase project
   (console.firebase.google.com), enable Firestore, and paste your
   project's config values below. Until you do, the app keeps working
   fine on a single device using local storage. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBXqvx5EGPpwjyU6CDfNusAT68q-0qwf2I",
  authDomain: "chore-champions-85cd9.firebaseapp.com",
  projectId: "chore-champions-85cd9",
  storageBucket: "chore-champions-85cd9.firebasestorage.app",
  messagingSenderId: "1014728208825",
  appId: "1:1014728208825:web:f9a7305cbe8ed19972c668"
};
const FIRESTORE_COLLECTION = 'chorechampions';

let db = null;
if(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey !== 'YOUR_API_KEY' && window.firebase){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
  }catch(e){
    console.error('Firebase init failed', e);
    db = null;
  }
}

const STORAGE_KEY = 'chorecamp-data-v1';

const storageAPI = db ? {
  async get(key){
    const doc = await db.collection(FIRESTORE_COLLECTION).doc(key).get();
    if(!doc.exists) throw new Error('not found');
    return { key, value: doc.data().value, shared: true };
  },
  async set(key, value){
    await db.collection(FIRESTORE_COLLECTION).doc(key).set({ value, updatedAt: Date.now() });
    return { key, value, shared: true };
  }
} : (window.storage) ? window.storage : {
  async get(key){
    const raw = localStorage.getItem(key);
    if(raw === null) throw new Error('not found');
    return { key, value: raw, shared: false };
  },
  async set(key, value){
    localStorage.setItem(key, value);
    return { key, value, shared: false };
  }
};

let data = null;
let view = { screen: 'loading' };
let parentSession = false;
let pinBuffer = '';

const KID_EMOJI = ['🦊','🐻','🐼','🦁','🐯','🐨','🐸','🐧','🦄','🐙','🦋','🐢'];
const CHORE_EMOJI = ['🛏️','🐾','🗑️','🍽️','🧹','📚','🧺','🪥','🧼','🚗','🌱','📦'];
const REWARD_EMOJI = ['📱','🎬','🍦','🌙','💵','🎮','🍕','🎨','🏊','🎟️'];
const GOAL_EMOJI = ['🎯','🚲','🎮','🧩','🎧','⚽','🛹','📷','🐶','🎁'];
const ASSET_EMOJI = ['🧸','🌱','🚀','🎮','🍔','🎬','⚡','🏠','🐾','📦'];
const SECTORS = ['Toys','Food','Tech','Sports','Energy','Other'];
const SECTOR_COLOR = { Toys:'#FF6FA5', Food:'#FFCB3D', Tech:'#3DC6F0', Sports:'#6BCB4F', Energy:'#FF8A65', Other:'#B39CA8' };
const SKILL_EMOJI = ['🎹','💻','⚽','🎨','📖','🎤','🏊','🥋','🧗','♟️'];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function defaultData(){
  const asset1 = uid(), asset2 = uid(), asset3 = uid();
  const now = Date.now();
  return {
    pin: '0000',
    kids: [
      { id: uid(), name: 'Emma', emoji: '🦊', color: '#EF6F53', points: 40, cashBalance: 0, lastInterestTs: now },
      { id: uid(), name: 'Jack', emoji: '🐻', color: '#4C9A6A', points: 25, cashBalance: 0, lastInterestTs: now }
    ],
    chores: [
      { id: uid(), name: 'Make your bed', points: 5, emoji: '🛏️', frequency: 'daily', category: 'core' },
      { id: uid(), name: 'Feed the pet', points: 5, emoji: '🐾', frequency: 'daily', category: 'core' },
      { id: uid(), name: 'Take out trash', points: 10, emoji: '🗑️', frequency: 'daily', category: 'core' },
      { id: uid(), name: 'Do the dishes', points: 15, emoji: '🍽️', frequency: 'daily', category: 'core' },
      { id: uid(), name: 'Homework done', points: 10, emoji: '📚', frequency: 'daily', category: 'core' },
      { id: uid(), name: 'Clean your room', points: 20, emoji: '🧽', frequency: 'weekly', category: 'bonus' }
    ],
    rewards: [
      { id: uid(), name: '30 min extra screen time', cost: 50, emoji: '📱', cash: 0 },
      { id: uid(), name: 'Pick movie night film', cost: 75, emoji: '🎬', cash: 0 },
      { id: uid(), name: 'Ice cream trip', cost: 150, emoji: '🍦', cash: 0 },
      { id: uid(), name: 'Stay up 30 min late', cost: 60, emoji: '🌙', cash: 0 },
      { id: uid(), name: '$5 cash', cost: 200, emoji: '💵', cash: 5 }
    ],
    completions: [],
    redemptions: [],
    bankTx: [],
    savingsGoals: [],
    investAssets: [
      { id: asset1, name: 'Big Toy Co.', emoji: '🧸', price: 10, blurb: 'Makes toys and games kids love.', sector: 'Toys', originStory: 'Started in a garage by two friends who thought toys should be more fun and less boring.' },
      { id: asset2, name: 'Green Energy Fund', emoji: '🌱', price: 6, blurb: 'Companies building clean power.', sector: 'Energy', originStory: 'A group of scientists teamed up to build power that doesn\'t hurt the planet.' },
      { id: asset3, name: 'Space Explorers Inc.', emoji: '🚀', price: 15, blurb: 'Builds rockets and satellites.', sector: 'Tech', originStory: 'Founded by a rocket-obsessed engineer who wanted to make space travel normal.' }
    ],
    priceEvents: [
      { id: uid(), assetId: asset1, price: 10, headline: 'Big Toy Co. started trading!', ts: now },
      { id: uid(), assetId: asset2, price: 6, headline: 'Green Energy Fund started trading!', ts: now },
      { id: uid(), assetId: asset3, price: 15, headline: 'Space Explorers Inc. started trading!', ts: now }
    ],
    financials: [
      { id: uid(), assetId: asset1, quarter: 'Q1', revenue: 50000, cogs: 20000, opex: 15000, ts: now },
      { id: uid(), assetId: asset2, quarter: 'Q1', revenue: 80000, cogs: 50000, opex: 20000, ts: now },
      { id: uid(), assetId: asset3, quarter: 'Q1', revenue: 120000, cogs: 90000, opex: 20000, ts: now }
    ],
    holdings: [],
    skills: [
      { id: uid(), name: 'Piano', emoji: '🎹', points: 10 },
      { id: uid(), name: 'Coding', emoji: '💻', points: 15 },
      { id: uid(), name: 'Soccer', emoji: '⚽', points: 10 },
      { id: uid(), name: 'Reading', emoji: '📖', points: 5 }
    ],
    skillLogs: [],
    bonusAwards: [],
    interestRate: 5,
    interestLog: []
  };
}

async function loadData(){
  try{
    const res = await storageAPI.get(STORAGE_KEY, true);
    data = res && res.value ? JSON.parse(res.value) : defaultData();
  }catch(e){
    data = defaultData();
  }
  if(!data.pin) data.pin = '0000';
  if(!Array.isArray(data.bankTx)) data.bankTx = [];
  if(!Array.isArray(data.savingsGoals)) data.savingsGoals = [];
  if(!Array.isArray(data.investAssets)) data.investAssets = [];
  if(!Array.isArray(data.priceEvents)) data.priceEvents = [];
  if(!Array.isArray(data.financials)) data.financials = [];
  data.investAssets.forEach(a => { if(!a.sector) a.sector = 'Other'; if(typeof a.originStory !== 'string') a.originStory = ''; });
  if(!Array.isArray(data.holdings)) data.holdings = [];
  data.holdings.forEach(h => { if(!h.firstBuyTs) h.firstBuyTs = 0; });

  if(!Array.isArray(data.interestLog)) data.interestLog = [];
  data.kids.forEach(k => { if(typeof k.cashBalance !== 'number') k.cashBalance = 0; });
  data.kids.forEach(k => { if(!k.lastInterestTs) k.lastInterestTs = Date.now(); });

  data.bankTx.forEach(t => { if(!t.purpose) t.purpose = 'general'; });
  await saveData();
}

const WEEK_MS = 7*24*60*60*1000;

const MIN_INTEREST_BALANCE = 20;

async function accrueInterest(){
  let changed = false;
  const now = Date.now();
  data.kids.forEach(kid=>{
    if(!kid.lastInterestTs){ kid.lastInterestTs = now; return; }
    let weeksElapsed = Math.floor((now - kid.lastInterestTs) / WEEK_MS);
    if(weeksElapsed <= 0) return;
    weeksElapsed = Math.min(weeksElapsed, 520);
    const goalsSaved = data.savingsGoals.filter(g=>g.kidId===kid.id).reduce((s,g)=>s+g.saved, 0);
    const weeklyRate = (data.interestRate/100) / 52;
    for(let i=0;i<weeksElapsed;i++){
      const base = kid.cashBalance + goalsSaved;
      if(base >= MIN_INTEREST_BALANCE){
        const interest = Math.round(base * weeklyRate * 100) / 100;
        if(interest > 0){
          kid.cashBalance = Math.round((kid.cashBalance + interest) * 100) / 100;
          data.interestLog.push({ id: uid(), kidId: kid.id, amount: interest, ts: kid.lastInterestTs + WEEK_MS*(i+1) });
          changed = true;
        }
      }
    }
    kid.lastInterestTs = kid.lastInterestTs + WEEK_MS*weeksElapsed;
  });
  if(changed) await saveData();
}

function playChime(big){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const notes = big ? [523.25,659.25,783.99,1046.5] : [523.25,783.99];
    notes.forEach((freq,i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      osc.connect(gain); gain.connect(ctx.destination);
      const start = ctx.currentTime + i*0.09;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.22, start+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start+0.3);
      osc.start(start); osc.stop(start+0.32);
    });
  }catch(e){}
}

function ownershipTimeline(assetId, firstBuyTs){

function assetTrend(assetId){
  const events = assetEvents(assetId);
  if(events.length < 2) return null;
  const diff = events[0].price - events[1].price;
  if(diff > 0) return 'up';
  if(diff < 0) return 'down';
  return 'flat';
}

function kidSectorBreakdown(kidId){
  const holdings = data.holdings.filter(h=>h.kidId===kidId);
  const bySector = {};
  let total = 0;
  holdings.forEach(h=>{
    const a = findAsset(h.assetId);
    if(!a) return;
    const value = h.units * a.price;
    bySector[a.sector] = (bySector[a.sector]||0) + value;
    total += value;
  });
  return { bySector, total, sectorCount: Object.keys(bySector).length };
}

function growthScore(assetId){
  const events = assetEvents(assetId);
  if(events.length < 2) return null;
  const oldest = events[events.length-1].price;
  const latest = events[0].price;
  if(oldest <= 0) return null;
  return ((latest - oldest) / oldest) * 100;
}

function stabilityScore(assetId){
  const events = assetEvents(assetId).map(e=>e.price);
  if(events.length < 3) return null;
  const changes = [];
  for(let i=0;i<events.length-1;i++){
    changes.push(Math.abs((events[i]-events[i+1])/events[i+1]));
  }
  const avgChange = changes.reduce((a,b)=>a+b,0)/changes.length;
  return Math.max(0, Math.min(100, 100 - avgChange*200));
}

function isToday(ts){
  const d = new Date(ts), n = new Date();
  return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
}

function isSameDay(ts, dayTs){
  const d = new Date(ts), n = new Date(dayTs);
  return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
}

function startOfDay(ts){
  const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime();
}

function startOfWeek(ts){
  const d = new Date(ts); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - d.getDay());
  return d.getTime();
}

function isSameWeek(ts, refTs){
  return startOfWeek(ts) === startOfWeek(refTs === undefined ? Date.now() : refTs);
}

function weekDates(){
  const start = startOfWeek(Date.now());
  const days = [];
  for(let i=0;i<7;i++){
    const d = new Date(start);
    d.setDate(d.getDate()+i);
    days.push(d);
  }
  return days;
}

function coreDaysThisWeek(kidId){
  const today0 = startOfDay(Date.now());
  return weekDates().filter(d => d.getTime() <= today0 && isDayFullyDone(kidId, d.getTime())).length;
}

    const riddleIndex = Math.floor(Math.random()*RIDDLES.length);
    data.treasureBox = { weekStart, kidDigits, riddleIndex, riddleSolved: false };

function dayCompletionSet(kidId, dayTs){
  return new Set(
    data.completions
      .filter(c => c.kidId===kidId && c.status!=='rejected' && isSameDay(c.ts, dayTs))
      .map(c => c.choreId)
  );
}

function isDayFullyDone(kidId, dayTs){
  const chores = dailyChoresList();
  if(chores.length===0) return false;
  const done = dayCompletionSet(kidId, dayTs);
  return chores.every(c => done.has(c.id));
}

function currentStreak(kidId){
  let streak = 0;
  let cursor = startOfDay(Date.now());
  if(!isDayFullyDone(kidId, cursor)){
    cursor = startOfDay(cursor - 86400000);
  }
  while(isDayFullyDone(kidId, cursor)){
    streak++;
    cursor = startOfDay(cursor - 86400000);
  }
  return streak;
}

function bestStreak(kidId){
  const doneTs = data.completions.filter(c=>c.kidId===kidId && c.status!=='rejected').map(c=>c.ts);
  if(!doneTs.length) return 0;
  let cursor = startOfDay(Math.min(...doneTs));
  const end = startOfDay(Date.now());
  let best = 0, run = 0;
  while(cursor <= end){
    if(isDayFullyDone(kidId, cursor)){ run++; best = Math.max(best, run); }
    else { run = 0; }
    cursor = startOfDay(cursor + 86400000);
  }
  return best;
}

function projectGrowth(amount, weeks, ratePct){
  let bal = amount;
  const weeklyRate = (ratePct/100)/52;
  for(let i=0;i<weeks;i++){
    if(bal >= MIN_INTEREST_BALANCE){
      const interest = Math.round(bal*weeklyRate*100)/100;
      bal = Math.round((bal+interest)*100)/100;
    }
  }
  return bal;
}

function trendArrow(trend){
  if(trend==='up') return '<span style="color:var(--green-deep);">▲</span>';
  if(trend==='down') return '<span style="color:var(--red-deep);">▼</span>';
  if(trend==='flat') return '<span style="color:var(--ink-soft);">–</span>';
  return '<span style="color:var(--ink-soft);">New</span>';
}

function pctOf(part, whole){
  if(!whole || whole <= 0) return 0;
  return Math.max(0, Math.min(100, Math.round((part/whole)*100)));
}

const DAY_LABELS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function renderStreakHeader(kid){
  const streak = currentStreak(kid.id);
  const best = bestStreak(kid.id);
  const dChores = dailyChoresList();
  const today0 = startOfDay(Date.now());

  const days = weekDates().map(d=>{
    const dayTs = d.getTime();
    const isFuture = dayTs > today0;
    const isTodayCell = dayTs === today0;
    let stateClass = 'future', icon = '—';
    if(!isFuture){
      const done = dayCompletionSet(kid.id, dayTs);
      const total = dChores.length;
      const doneCount = dChores.filter(c=>done.has(c.id)).length;
      if(total === 0){ stateClass = 'future'; icon = '—'; }
      else if(doneCount === total){ stateClass = 'full'; icon = '✅'; }
      else if(doneCount > 0){ stateClass = 'partial'; icon = `${doneCount}/${total}`; }
      else { stateClass = 'empty'; icon = '·'; }
    }
    return `<div class="week-day ${stateClass}${isTodayCell?' today':''}">
      <div class="week-day-label">${DAY_LABELS[d.getDay()]}</div>
      <div class="week-day-num">${d.getDate()}</div>
      <div class="week-day-icon">${icon}</div>
    </div>`;
  }).join('');

  return `
    <div class="card" style="text-align:center;margin-bottom:16px;">
      <div class="section-label" style="margin-top:0">Current streak</div>
      <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:34px;color:var(--gold-deep);">${streak>0?'🔥 ':''}${streak} day${streak===1?'':'s'}</div>
      <p class="hint">Best streak so far: ${best} day${best===1?'':'s'}</p>
      <div class="week-grid" style="margin-top:10px;">${days}</div>
      ${dChores.length===0 ? `<p class="hint">Add core chores in Parent mode to start tracking a streak.</p>` : `<p class="hint">A full day means every core chore was done that day.</p>`}
    </div>
  `;
}

function renderKid(app){
  const kid = findKid(view.kidId);
  if(!kid){ view={screen:'home'}; return render(); }
  const tab = view.tab || 'chores';

  const myCompletions = data.completions.filter(c=>c.kidId===kid.id).sort((a,b)=>b.ts-a.ts);
  const myRedemptions = data.redemptions.filter(r=>r.kidId===kid.id).sort((a,b)=>b.ts-a.ts);
  const myBankTx = data.bankTx.filter(t=>t.kidId===kid.id).sort((a,b)=>b.ts-a.ts);
  const mySkillLogs = data.skillLogs.filter(s=>s.kidId===kid.id).sort((a,b)=>b.ts-a.ts);
  const myBonusAwards = data.bonusAwards.filter(b=>b.kidId===kid.id).sort((a,b)=>b.ts-a.ts);
  const doneNowIds = new Set(
    data.chores.filter(c => {
      const relevant = myCompletions.filter(x => x.choreId===c.id && x.status !== 'rejected');
      if(c.frequency === 'weekly'){
        return relevant.some(x => isSameWeek(x.ts));
      }
      return relevant.some(x => isToday(x.ts));
    }).map(c => c.id)
  );

  let body = '';
  if(tab === 'chores'){
    const availableChores = data.chores.filter(c => !doneNowIds.has(c.id));
    const availableCore = availableChores.filter(c => c.category === 'core');
    const availableBonus = availableChores.filter(c => c.category === 'bonus');
    const streakHeader = renderStreakHeader(kid);
    const choreCardHTML = c => `
        <div class="item-card">
          <div class="item-emoji">${c.emoji}</div>
          <div class="item-body">
            <div class="item-name">${esc(c.name)}</div>
            <div class="item-sub">+${c.points} pts${c.category==='bonus' ? ' · Bonus · '+(c.frequency==='weekly'?'once a week':'daily') : ' · Core'}</div>
          </div>
          <div class="item-action"><button class="btn go" data-chore="${c.id}">I did it!</button></div>

    const idx = Math.max(0, Math.min(eventsAsc.length-1, parseInt(slider.value)));
    const point = eventsAsc[idx];
    if(!point) return;
    const value = holding.units * point.price;
    const gain = value - holding.totalCost;
    const dateEl = document.getElementById('timelineDate-'+holdingId);

    if(amount > currentValue + 0.005){ showToast("You don't have that much to sell."); return; }

    const amount = Math.round((parseFloat(document.getElementById('giveAmt').value)||0)*100)/100;
    if(amount <= 0){ showToast('Enter an amount first.'); return; }
    if(kind === 'withdraw' && amount > kid.cashBalance){ showToast("That's more than you have ready to use."); return; }
    let note = '';
    if(kind === 'donate'){
      const item = document.getElementById('giveItem').value.trim();
      const link = document.getElementById('giveLink').value.trim();
      if(!item){ showToast('Say who or what you want to give to first.'); return; }
      note = item + (link ? ` (${link})` : '');
    }
    data.bankTx.push({ id: uid(), kidId: kid.id, type: kind, purpose:'give', amount, note, status:'pending', ts: Date.now() });
    await saveData();
    view.giveForm = null;
    showToast('Request sent to Mom & Dad!');
    render();
  });
}

function renderPin(app){
  const dots = [0,1,2,3].map(i=>`<div class="pin-dot ${i<pinBuffer.length?'filled':''}"></div>`).join('');
  app.innerHTML = `
    <button class="back-link" id="homeBtn">← All kids</button>
    <div class="pin-wrap">
      <div class="brand-mark" style="margin:0 auto 10px;">🔒</div>
      <div class="section-label" style="margin:0 0 4px;">Enter parent PIN</div>
      <div class="pin-dots">${dots}</div>
      <div class="pin-pad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="pin-key" data-n="${n}">${n}</button>`).join('')}
        <button class="pin-key clear" id="pinClear">Clear</button>
        <button class="pin-key" data-n="0">0</button>
        <div></div>
      </div>
    </div>
  `;
  document.getElementById('homeBtn').addEventListener('click', ()=>{ view={screen:'home'}; render(); });
  document.getElementById('pinClear').addEventListener('click', ()=>{ pinBuffer=''; render(); });
  app.querySelectorAll('[data-n]').forEach(b=>b.addEventListener('click', ()=>{
    if(pinBuffer.length>=4) return;
    pinBuffer += b.dataset.n;
    if(pinBuffer.length===4){
      if(pinBuffer === data.pin){
        parentSession = true;
        pinBuffer='';
        view = { screen:'parent', tab:'approvals' };
        render();
      } else {
        showToast('Wrong PIN, try again.');
        setTimeout(()=>{ pinBuffer=''; render(); }, 500);
      }
    } else {
      render();
    }
  }));
}

(async function init(){
  await loadData();
  await accrueInterest();
  if(ensureTreasureBox()){ await saveData(); }
  view = { screen: 'home' };
  render();

  if(db){
    db.collection(FIRESTORE_COLLECTION).doc(STORAGE_KEY).onSnapshot(doc => {
      if(!doc.exists) return;
      if(doc.metadata.hasPendingWrites) return;
      try{
        data = JSON.parse(doc.data().value);
        render();
      }catch(e){
        console.error('Failed to apply synced data', e);
      }
    });
  }
})();
</script>
